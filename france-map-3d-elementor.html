  // ==============================================
  // FONCTION POUR GÉNÉRER LE SLUG SEO
  // ==============================================

  function generateSlug(text) {
    return text
      .toString()
      .toLowerCase()
      .normalize('NFD') // Décompose les caractères accentués
      .replace(/[\u0300-\u036f]/g, '') // Supprime les accents
      .replace(/[^a-z0-9\s-]/g, '') // Supprime les caractères spéciaux
      .trim()
      .replace(/\s+/g, '-') // Remplace les espaces par des tirets
      .replace(/-+/g, '-'); // Supprime les tirets multiples
  }

  // ==============================================
  // GESTION DU POP-UP
  // ==============================================

  const popup = document.getElementById('franceMapPopup');
  const popupTitle = document.getElementById('popupTitle');
  const popupSubtitle = document.getElementById('popupSubtitle');
  const popupCTA = document.getElementById('popupCTA');
  const popupClose = document.getElementById('popupClose');

  // Fonction pour ouvrir le pop-up
  function openPopup(deptNumber) {
    const deptData = grandesVilles[deptNumber];

    if (!deptData) {
      console.error('Département non trouvé:', deptNumber);
      return;
    }

    // Remplir le contenu du pop-up
    popupTitle.textContent = deptData.departement;
    popupSubtitle.textContent = deptData.ville;

    // Générer le slug et l'URL
    const villeSlug = generateSlug(deptData.ville);
    const targetUrl = '/preparateur-mental-ville/' + villeSlug + '/';

    // Configurer le bouton CTA
    popupCTA.onclick = function() {
      window.location.href = targetUrl;
    };

    // Afficher le pop-up
    popup.classList.add('active');
    document.body.style.overflow = 'hidden'; // Empêche le scroll
  }

  // Fonction pour fermer le pop-up
  function closePopup() {
    popup.classList.remove('active');
    document.body.style.overflow = ''; // Réactive le scroll
  }

  // ==============================================
  // ÉVÉNEMENTS
  // ==============================================

  // Ajouter les événements de clic sur chaque département
  const departments = document.querySelectorAll('.france-map-dept');
  departments.forEach(function(dept) {
    dept.addEventListener('click', function(e) {
      e.preventDefault();
      const deptNumber = this.getAttribute('data-dept');
      openPopup(deptNumber);
    });
  });

  // Fermer le pop-up en cliquant sur le bouton de fermeture
  popupClose.addEventListener('click', closePopup);

  // Fermer le pop-up en cliquant à l'extérieur
  popup.addEventListener('click', function(e) {
    if (e.target === popup) {
      closePopup();
    }
  });

  // Fermer le pop-up avec la touche Échap
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && popup.classList.contains('active')) {
      closePopup();
    }
  });

    });
