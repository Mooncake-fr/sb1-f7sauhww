<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Propriétés Immobilières</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --primary-dark: #1d4ed8;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --radius-lg: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 32px 24px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo-text h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .logo-text p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: var(--shadow);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--background);
            border-color: var(--secondary);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-icon {
            padding: 8px 16px;
            font-size: 13px;
        }

        .btn-lg {
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 700;
            width: auto;
            min-width: 200px;
        }

        .btn-block {
            width: 100%;
        }

        .cta-section {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 2px dashed var(--primary);
            border-radius: var(--radius-lg);
            padding: 32px;
            text-align: center;
            margin-bottom: 32px;
        }

        .cta-section h3 {
            color: var(--primary);
            font-size: 20px;
            margin-bottom: 12px;
        }

        .cta-section p {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 15px;
        }

        .sidebar-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-actions .btn {
            width: 100%;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            padding: 0 8px;
        }

        .property-card {
            background: var(--surface);
            border: 2px solid transparent;
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .property-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow);
            transform: translateX(4px);
        }

        .property-card.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-color: var(--primary);
            color: white;
            box-shadow: var(--shadow-lg);
        }

        .property-card.active .property-type,
        .property-card.active .property-status {
            color: rgba(255, 255, 255, 0.9);
        }

        .property-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .property-meta {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .property-type,
        .property-status {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--background);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .property-card.active .property-type,
        .property-card.active .property-status {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar-title h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .topbar-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .topbar-actions {
            display: flex;
            gap: 12px;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-secondary);
        }

        .welcome-icon {
            width: 120px;
            height: 120px;
            background: var(--background);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            margin-bottom: 24px;
        }

        .welcome-screen h2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .welcome-screen p {
            font-size: 16px;
            max-width: 400px;
        }

        /* Tabs Navigation */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 32px;
            background: var(--background);
            padding: 4px;
            border-radius: var(--radius);
        }

        .tab {
            flex: 1;
            padding: 12px 24px;
            border: none;
            background: transparent;
            border-radius: calc(var(--radius) - 4px);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab:hover {
            color: var(--text-primary);
            background: rgba(37, 99, 235, 0.1);
        }

        .tab.active {
            background: var(--surface);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Cards */
        .card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid {
            display: grid;
            gap: 24px;
        }

        .grid-2 {
            grid-template-columns: repeat(2, 1fr);
        }

        .grid-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        .grid-4 {
            grid-template-columns: repeat(4, 1fr);
        }

        @media (max-width: 1200px) {
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
        }

        /* Stats Cards */
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
        }

        .stat-card.success::before {
            background: linear-gradient(90deg, var(--success), #34d399);
        }

        .stat-card.danger::before {
            background: linear-gradient(90deg, var(--danger), #f87171);
        }

        .stat-card.warning::before {
            background: linear-gradient(90deg, var(--warning), #fbbf24);
        }

        .stat-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .stat-change {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Category Card */
        .category-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            transition: all 0.2s ease;
        }

        .category-card:hover {
            box-shadow: var(--shadow);
            border-color: var(--primary);
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .category-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--background) 0%, #e2e8f0 100%);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .category-info {
            flex: 1;
            min-width: 0;
        }

        .category-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .category-subtitle {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: var(--background);
            border-radius: 6px;
            gap: 8px;
        }

        .info-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .info-value {
            font-size: 13px;
            color: var(--text-primary);
            font-weight: 500;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .password-field {
            font-family: monospace;
        }

        .password-toggle {
            font-size: 12px;
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
            margin-left: 8px;
        }

        .password-toggle:hover {
            color: var(--primary-dark);
        }

        /* Table */
        .table-container {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--background);
        }

        th {
            padding: 16px;
            text-align: left;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        td {
            padding: 16px;
            border-top: 1px solid var(--border);
            font-size: 14px;
        }

        tbody tr {
            transition: background-color 0.2s ease;
        }

        tbody tr:hover {
            background: var(--background);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .amount-positive {
            color: var(--success);
            font-weight: 600;
        }

        .amount-negative {
            color: var(--danger);
            font-weight: 600;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: var(--surface);
            border-radius: var(--radius-lg);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: var(--background);
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: var(--danger);
            color: white;
        }

        .modal-body {
            padding: 24px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            color: var(--text-primary);
            background: var(--surface);
            transition: all 0.2s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .form-actions .btn {
            flex: 1;
        }

        .empty-state {
            text-align: center;
            padding: 64px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 50vh;
            }

            .content-area {
                padding: 20px;
            }

            .topbar {
                padding: 16px 20px;
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .topbar-actions {
                width: 100%;
            }

            .btn {
                font-size: 13px;
                padding: 10px 16px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--background);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">🏠</div>
                    <div class="logo-text">
                        <h1>PropertyHub</h1>
                        <p>Gestion immobilière</p>
                    </div>
                </div>
                <div class="sidebar-actions">
                    <button class="btn btn-primary" onclick="showAddPropertyModal()">
                        <span>➕</span>
                        <span>Nouvelle Propriété</span>
                    </button>
                    <button class="btn btn-secondary" onclick="exportData()">
                        <span>💾</span>
                        <span>Sauvegarder</span>
                    </button>
                    <button class="btn btn-secondary" onclick="importData()">
                        <span>📂</span>
                        <span>Importer</span>
                    </button>
                </div>
            </div>
            <div class="sidebar-content">
                <div class="section-title">Mes Propriétés</div>
                <div id="propertyList">
                    <!-- Properties will be rendered here -->
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="topbar">
                <div class="topbar-title">
                    <h2 id="currentPropertyName">Tableau de bord</h2>
                    <div class="topbar-subtitle" id="currentPropertySubtitle">Sélectionnez une propriété</div>
                </div>
                <div class="topbar-actions">
                    <button class="btn btn-danger btn-icon" id="deleteBtn" style="display: none;" onclick="deleteCurrentProperty()">
                        <span>🗑️</span>
                        <span>Supprimer</span>
                    </button>
                </div>
            </div>

            <div class="content-area" id="contentArea">
                <div class="welcome-screen">
                    <div class="welcome-icon">🏠</div>
                    <h2>Bienvenue sur PropertyHub</h2>
                    <p>Commencez par ajouter votre première propriété pour gérer vos biens immobiliers en toute simplicité</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Property Modal -->
    <div id="addPropertyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Ajouter une Propriété</h2>
                <button class="close-btn" onclick="closeModal('addPropertyModal')">✕</button>
            </div>
            <div class="modal-body">
                <form id="addPropertyForm" onsubmit="addProperty(event)">
                    <div class="form-group">
                        <label>Nom de la propriété *</label>
                        <input type="text" id="propertyName" required placeholder="Ex: Appartement 15ème">
                    </div>
                    <div class="form-group">
                        <label>Type *</label>
                        <select id="propertyType" required>
                            <option value="appartement">Appartement</option>
                            <option value="maison">Maison</option>
                            <option value="studio">Studio</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Adresse</label>
                        <textarea id="propertyAddress" rows="2" placeholder="Adresse complète"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Statut</label>
                        <select id="propertyStatus">
                            <option value="loué">Loué</option>
                            <option value="disponible">Disponible</option>
                            <option value="propriétaire">Occupé par le propriétaire</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Loyer mensuel (€)</label>
                        <input type="number" id="propertyRent" placeholder="0.00" step="0.01">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeModal('addPropertyModal')">Annuler</button>
                        <button type="submit" class="btn btn-primary">Ajouter</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Category Modal -->
    <div id="editCategoryModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="editCategoryTitle">Modifier la catégorie</h2>
                <button class="close-btn" onclick="closeModal('editCategoryModal')">✕</button>
            </div>
            <div class="modal-body">
                <form id="editCategoryForm" onsubmit="saveCategory(event)">
                    <div class="form-group">
                        <label>Fournisseur</label>
                        <input type="text" id="categoryProvider" placeholder="Ex: EDF, Engie...">
                    </div>
                    <div class="form-group">
                        <label>Numéro de compte</label>
                        <input type="text" id="categoryAccount" placeholder="Référence client">
                    </div>
                    <div class="form-group">
                        <label>Identifiant</label>
                        <input type="text" id="categoryUsername" placeholder="Identifiant de connexion">
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="categoryPassword" placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label>URL du dashboard</label>
                        <input type="url" id="categoryUrl" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="categoryNotes" rows="3" placeholder="Informations complémentaires..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeModal('editCategoryModal')">Annuler</button>
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Add Transaction Modal -->
    <div id="addTransactionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Ajouter une Transaction</h2>
                <button class="close-btn" onclick="closeModal('addTransactionModal')">✕</button>
            </div>
            <div class="modal-body">
                <form id="addTransactionForm" onsubmit="addTransaction(event)">
                    <div class="form-group">
                        <label>Type *</label>
                        <select id="transactionType" required>
                            <option value="revenue">💰 Revenu (Loyer)</option>
                            <option value="expense">💸 Dépense (Facture)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Catégorie *</label>
                        <select id="transactionCategory" required>
                            <option value="loyer">Loyer</option>
                            <option value="électricité">Électricité</option>
                            <option value="gaz">Gaz</option>
                            <option value="eau">Eau</option>
                            <option value="internet">Internet</option>
                            <option value="taxe">Taxe</option>
                            <option value="impôt">Impôt</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Montant (€) *</label>
                        <input type="number" id="transactionAmount" required step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Date *</label>
                        <input type="date" id="transactionDate" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" id="transactionDescription" placeholder="Description...">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeModal('addTransactionModal')">Annuler</button>
                        <button type="submit" class="btn btn-primary">Ajouter</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Data Storage
        let properties = [];
        let currentPropertyId = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            renderPropertyList();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('transactionDate').value = today;
        });

        // Local Storage
        function saveToLocalStorage() {
            localStorage.setItem('propertyManagementData', JSON.stringify(properties));
        }

        function loadData() {
            const savedData = localStorage.getItem('propertyManagementData');
            if (savedData) {
                properties = JSON.parse(savedData);
            }
        }

        // Modal Management
        function showModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function showAddPropertyModal() {
            document.getElementById('addPropertyForm').reset();
            showModal('addPropertyModal');
        }

        // Property Management
        function addProperty(event) {
            event.preventDefault();

            const property = {
                id: Date.now(),
                name: document.getElementById('propertyName').value,
                type: document.getElementById('propertyType').value,
                address: document.getElementById('propertyAddress').value,
                status: document.getElementById('propertyStatus').value,
                rent: parseFloat(document.getElementById('propertyRent').value) || 0,
                categories: {
                    électricité: {},
                    gaz: {},
                    eau: {},
                    internet: {},
                    taxe: {},
                    impôt: {}
                },
                transactions: []
            };

            properties.push(property);
            saveToLocalStorage();
            renderPropertyList();
            closeModal('addPropertyModal');
            showProperty(property.id);
        }

        function renderPropertyList() {
            const listElement = document.getElementById('propertyList');

            if (properties.length === 0) {
                listElement.innerHTML = '<div class="empty-state" style="padding: 32px 8px;"><div class="empty-icon">📭</div><p style="font-size: 13px;">Aucune propriété</p></div>';
                return;
            }

            listElement.innerHTML = properties.map(property => `
                <div class="property-card ${currentPropertyId === property.id ? 'active' : ''}"
                     onclick="showProperty(${property.id})">
                    <div class="property-name">${property.name}</div>
                    <div class="property-meta">
                        <span class="property-type">${property.type}</span>
                        <span class="property-status">${property.status}</span>
                    </div>
                </div>
            `).join('');
        }

        function showProperty(propertyId) {
            currentPropertyId = propertyId;
            const property = properties.find(p => p.id === propertyId);
            if (!property) return;

            renderPropertyList();

            // Update topbar
            document.getElementById('currentPropertyName').textContent = property.name;
            document.getElementById('currentPropertySubtitle').textContent = `${property.type} • ${property.status}`;
            document.getElementById('deleteBtn').style.display = 'flex';

            // Calculate stats
            const revenues = property.transactions
                .filter(t => t.type === 'revenue')
                .reduce((sum, t) => sum + t.amount, 0);

            const expenses = property.transactions
                .filter(t => t.type === 'expense')
                .reduce((sum, t) => sum + t.amount, 0);

            const balance = revenues - expenses;

            // Render content
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('finances')" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; font-weight: 700;">💰 Factures & Revenus</button>
                    <button class="tab" onclick="switchTab('overview')">📊 Vue d'ensemble</button>
                    <button class="tab" onclick="switchTab('accounts')">🔑 Comptes & Services</button>
                </div>

                <!-- Finances Tab (Premier maintenant) -->
                <div id="finances-tab" class="tab-content active">
                    <div class="cta-section">
                        <h3>💰 Ajouter une facture ou un revenu</h3>
                        <p>Suivez vos revenus de loyers et vos dépenses (factures, taxes, etc.)</p>
                        <button class="btn btn-success btn-lg" onclick="showAddTransactionModal()">
                            <span>➕</span>
                            <span>Ajouter une Transaction</span>
                        </button>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">💳 Historique des Transactions</h3>
                        </div>
                        ${renderTransactions(property)}
                    </div>

                    <div style="margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap;">
                        <button class="btn btn-secondary" onclick="exportPropertyToCSV(${property.id})">
                            <span>📄</span>
                            <span>Exporter en CSV</span>
                        </button>
                        <button class="btn btn-secondary" onclick="exportPropertyToPDF(${property.id})">
                            <span>📑</span>
                            <span>Générer rapport PDF</span>
                        </button>
                    </div>
                </div>

                <!-- Overview Tab -->
                <div id="overview-tab" class="tab-content">
                    <div class="grid grid-3" style="margin-bottom: 32px;">
                        <div class="stat-card success">
                            <div class="stat-label">Revenus totaux</div>
                            <div class="stat-value">${revenues.toFixed(2)} €</div>
                            <div class="stat-change">${property.transactions.filter(t => t.type === 'revenue').length} transaction(s)</div>
                        </div>
                        <div class="stat-card danger">
                            <div class="stat-label">Dépenses totales</div>
                            <div class="stat-value">${expenses.toFixed(2)} €</div>
                            <div class="stat-change">${property.transactions.filter(t => t.type === 'expense').length} transaction(s)</div>
                        </div>
                        <div class="stat-card ${balance >= 0 ? 'warning' : 'danger'}">
                            <div class="stat-label">Solde</div>
                            <div class="stat-value">${balance.toFixed(2)} €</div>
                            <div class="stat-change">${balance >= 0 ? 'Positif' : 'Négatif'}</div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">📋 Informations de la propriété</h3>
                        </div>
                        <div class="info-list">
                            <div class="info-item">
                                <span class="info-label">Type</span>
                                <span class="info-value">${property.type}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Statut</span>
                                <span class="info-value">${property.status}</span>
                            </div>
                            ${property.address ? `
                                <div class="info-item">
                                    <span class="info-label">Adresse</span>
                                    <span class="info-value">${property.address}</span>
                                </div>
                            ` : ''}
                            ${property.rent > 0 ? `
                                <div class="info-item">
                                    <span class="info-label">Loyer mensuel</span>
                                    <span class="info-value">${property.rent.toFixed(2)} €</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>

                <!-- Accounts Tab -->
                <div id="accounts-tab" class="tab-content">
                    <div class="grid grid-3">
                        ${renderCategoryCards(property)}
                    </div>
                </div>
            `;
        }

        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
                // Réinitialiser le style du bouton Finances
                if (tab.textContent.includes('Factures')) {
                    tab.style.background = '';
                    tab.style.color = '';
                }
            });
            event.target.classList.add('active');

            // Remettre le style vert si c'est Finances et actif
            if (tabName === 'finances') {
                event.target.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                event.target.style.color = 'white';
            }

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName + '-tab').classList.add('active');
        }

        function renderCategoryCards(property) {
            const categoryData = {
                'électricité': { icon: '⚡', name: 'Électricité', subtitle: 'Fournisseur d\'énergie' },
                'gaz': { icon: '🔥', name: 'Gaz', subtitle: 'Chauffage et eau chaude' },
                'eau': { icon: '💧', name: 'Eau', subtitle: 'Distribution d\'eau' },
                'internet': { icon: '🌐', name: 'Internet', subtitle: 'Fournisseur d\'accès' },
                'taxe': { icon: '🏛️', name: 'Taxe', subtitle: 'Taxes locales' },
                'impôt': { icon: '📊', name: 'Impôt', subtitle: 'Impôts fonciers' }
            };

            return Object.keys(property.categories).map(categoryKey => {
                const category = property.categories[categoryKey];
                const info = categoryData[categoryKey];
                const hasData = category.username || category.password || category.url;

                return `
                    <div class="category-card">
                        <div class="category-header">
                            <div class="category-icon">${info.icon}</div>
                            <div class="category-info">
                                <div class="category-name">${info.name}</div>
                            </div>
                        </div>
                        ${hasData ? `
                            <div class="info-list">
                                ${category.username ? `
                                    <div class="info-item">
                                        <span class="info-label">Identifiant</span>
                                        <span class="info-value">${category.username}</span>
                                    </div>
                                ` : ''}
                                ${category.password ? `
                                    <div class="info-item">
                                        <span class="info-label">Mot de passe</span>
                                        <span class="info-value">
                                            <span class="password-field" id="pwd-${property.id}-${categoryKey}">••••••••</span>
                                            <span class="password-toggle" onclick="togglePassword(${property.id}, '${categoryKey}')">Voir</span>
                                        </span>
                                    </div>
                                ` : ''}
                                ${category.url ? `
                                    <div class="info-item">
                                        <span class="info-label">Site web</span>
                                        <span class="info-value"><a href="${category.url}" target="_blank" style="color: var(--primary); text-decoration: none;">🔗 Ouvrir</a></span>
                                    </div>
                                ` : ''}
                            </div>
                        ` : `
                            <div class="empty-state" style="padding: 20px 12px;">
                                <div class="empty-icon" style="font-size: 24px;">📝</div>
                                <p style="font-size: 11px;">Aucune info</p>
                            </div>
                        `}
                        <button class="btn btn-primary btn-block" style="padding: 8px 16px; font-size: 13px;" onclick="editCategory(${property.id}, '${categoryKey}')">
                            <span>✏️</span>
                            <span>Modifier</span>
                        </button>
                    </div>
                `;
            }).join('');
        }

        function togglePassword(propertyId, categoryName) {
            const property = properties.find(p => p.id === propertyId);
            const pwdElement = document.getElementById(`pwd-${propertyId}-${categoryName}`);
            const toggleBtn = pwdElement.nextElementSibling;

            if (pwdElement.textContent === '••••••••') {
                pwdElement.textContent = property.categories[categoryName].password;
                toggleBtn.textContent = 'Masquer';
            } else {
                pwdElement.textContent = '••••••••';
                toggleBtn.textContent = 'Afficher';
            }
        }

        let currentEditCategory = null;

        function editCategory(propertyId, categoryName) {
            currentEditCategory = { propertyId, categoryName };
            const property = properties.find(p => p.id === propertyId);
            const category = property.categories[categoryName];

            const categoryNames = {
                'électricité': 'Électricité',
                'gaz': 'Gaz',
                'eau': 'Eau',
                'internet': 'Internet',
                'taxe': 'Taxe',
                'impôt': 'Impôt'
            };

            document.getElementById('editCategoryTitle').textContent = `Modifier ${categoryNames[categoryName]}`;
            document.getElementById('categoryProvider').value = category.provider || '';
            document.getElementById('categoryAccount').value = category.account || '';
            document.getElementById('categoryUsername').value = category.username || '';
            document.getElementById('categoryPassword').value = category.password || '';
            document.getElementById('categoryUrl').value = category.url || '';
            document.getElementById('categoryNotes').value = category.notes || '';

            showModal('editCategoryModal');
        }

        function saveCategory(event) {
            event.preventDefault();

            if (!currentEditCategory) return;

            const property = properties.find(p => p.id === currentEditCategory.propertyId);
            property.categories[currentEditCategory.categoryName] = {
                provider: document.getElementById('categoryProvider').value,
                account: document.getElementById('categoryAccount').value,
                username: document.getElementById('categoryUsername').value,
                password: document.getElementById('categoryPassword').value,
                url: document.getElementById('categoryUrl').value,
                notes: document.getElementById('categoryNotes').value
            };

            saveToLocalStorage();
            closeModal('editCategoryModal');
            showProperty(currentEditCategory.propertyId);
        }

        // Transactions
        function showAddTransactionModal() {
            document.getElementById('addTransactionForm').reset();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('transactionDate').value = today;
            showModal('addTransactionModal');
        }

        function addTransaction(event) {
            event.preventDefault();

            if (!currentPropertyId) return;

            const property = properties.find(p => p.id === currentPropertyId);

            const transaction = {
                id: Date.now(),
                type: document.getElementById('transactionType').value,
                category: document.getElementById('transactionCategory').value,
                amount: parseFloat(document.getElementById('transactionAmount').value),
                date: document.getElementById('transactionDate').value,
                description: document.getElementById('transactionDescription').value
            };

            property.transactions.push(transaction);
            saveToLocalStorage();
            closeModal('addTransactionModal');
            showProperty(currentPropertyId);
        }

        function renderTransactions(property) {
            if (property.transactions.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <h3>Aucune transaction</h3>
                        <p>Commencez par ajouter votre première transaction</p>
                    </div>
                `;
            }

            const sortedTransactions = [...property.transactions].sort((a, b) =>
                new Date(b.date) - new Date(a.date)
            );

            return `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Type</th>
                                <th>Catégorie</th>
                                <th>Description</th>
                                <th>Montant</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            ${sortedTransactions.map(transaction => `
                                <tr>
                                    <td>${new Date(transaction.date).toLocaleDateString('fr-FR')}</td>
                                    <td>
                                        <span class="badge ${transaction.type === 'revenue' ? 'badge-success' : 'badge-danger'}">
                                            ${transaction.type === 'revenue' ? '💰 Revenu' : '💸 Dépense'}
                                        </span>
                                    </td>
                                    <td>${transaction.category}</td>
                                    <td>${transaction.description || '-'}</td>
                                    <td class="${transaction.type === 'revenue' ? 'amount-positive' : 'amount-negative'}">
                                        ${transaction.type === 'revenue' ? '+' : '-'}${transaction.amount.toFixed(2)} €
                                    </td>
                                    <td>
                                        <button class="btn btn-danger btn-icon" style="padding: 6px 12px; font-size: 12px;"
                                                onclick="deleteTransaction(${property.id}, ${transaction.id})">
                                            🗑️
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function deleteTransaction(propertyId, transactionId) {
            if (!confirm('Supprimer cette transaction ?')) return;

            const property = properties.find(p => p.id === propertyId);
            property.transactions = property.transactions.filter(t => t.id !== transactionId);

            saveToLocalStorage();
            showProperty(propertyId);
        }

        function deleteCurrentProperty() {
            if (!currentPropertyId) return;
            if (!confirm('Êtes-vous sûr de vouloir supprimer cette propriété ? Toutes les données seront perdues.')) return;

            properties = properties.filter(p => p.id !== currentPropertyId);
            saveToLocalStorage();
            currentPropertyId = null;
            renderPropertyList();

            document.getElementById('contentArea').innerHTML = `
                <div class="welcome-screen">
                    <div class="welcome-icon">🏠</div>
                    <h2>Bienvenue sur PropertyHub</h2>
                    <p>Commencez par ajouter votre première propriété pour gérer vos biens immobiliers en toute simplicité</p>
                </div>
            `;
            document.getElementById('currentPropertyName').textContent = 'Tableau de bord';
            document.getElementById('currentPropertySubtitle').textContent = 'Sélectionnez une propriété';
            document.getElementById('deleteBtn').style.display = 'none';
        }

        // Export / Import
        function exportData() {
            const dataStr = JSON.stringify(properties, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `propertyhub-backup-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            input.onchange = function(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        if (confirm('Remplacer toutes les données actuelles ?')) {
                            properties = importedData;
                            saveToLocalStorage();
                            renderPropertyList();
                            alert('✅ Données importées avec succès !');
                        }
                    } catch (error) {
                        alert('❌ Erreur lors de l\'importation. Vérifiez le fichier.');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function exportPropertyToCSV(propertyId) {
            const property = properties.find(p => p.id === propertyId);
            if (!property) return;

            let csv = 'Date,Type,Catégorie,Description,Montant\n';

            property.transactions.forEach(transaction => {
                const row = [
                    transaction.date,
                    transaction.type === 'revenue' ? 'Revenu' : 'Dépense',
                    transaction.category,
                    transaction.description || '',
                    transaction.amount.toFixed(2)
                ].map(field => `"${field}"`).join(',');
                csv += row + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${property.name.replace(/\s+/g, '-')}-transactions.csv`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function exportPropertyToPDF(propertyId) {
            const property = properties.find(p => p.id === propertyId);
            if (!property) return;

            const revenues = property.transactions
                .filter(t => t.type === 'revenue')
                .reduce((sum, t) => sum + t.amount, 0);

            const expenses = property.transactions
                .filter(t => t.type === 'expense')
                .reduce((sum, t) => sum + t.amount, 0);

            const balance = revenues - expenses;

            const reportWindow = window.open('', '_blank');
            reportWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>Rapport - ${property.name}</title>
                    <style>
                        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; padding: 40px; color: #1e293b; }
                        h1 { color: #2563eb; margin-bottom: 8px; }
                        h2 { color: #475569; margin-top: 32px; margin-bottom: 16px; font-size: 20px; }
                        .header { margin-bottom: 32px; padding-bottom: 24px; border-bottom: 2px solid #e2e8f0; }
                        .info { background: #f8fafc; padding: 20px; border-radius: 12px; margin-bottom: 24px; }
                        .info p { margin: 8px 0; }
                        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 24px 0; }
                        .stat-box { background: #f8fafc; padding: 20px; border-radius: 12px; text-align: center; border-top: 4px solid #2563eb; }
                        .stat-box h3 { margin: 0; font-size: 12px; text-transform: uppercase; color: #64748b; font-weight: 700; }
                        .stat-box .amount { font-size: 28px; font-weight: 700; margin-top: 8px; }
                        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
                        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; }
                        th { background: #f8fafc; font-weight: 600; font-size: 13px; text-transform: uppercase; color: #64748b; }
                        .revenue { color: #10b981; font-weight: 600; }
                        .expense { color: #ef4444; font-weight: 600; }
                        .footer { margin-top: 48px; padding-top: 24px; border-top: 2px solid #e2e8f0; color: #64748b; text-align: center; font-size: 14px; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h1>📊 Rapport de Propriété</h1>
                        <p style="color: #64748b;">Généré le ${new Date().toLocaleDateString('fr-FR')} à ${new Date().toLocaleTimeString('fr-FR')}</p>
                    </div>

                    <div class="info">
                        <h2>${property.name}</h2>
                        <p><strong>Type:</strong> ${property.type}</p>
                        <p><strong>Statut:</strong> ${property.status}</p>
                        ${property.address ? `<p><strong>Adresse:</strong> ${property.address}</p>` : ''}
                        ${property.rent > 0 ? `<p><strong>Loyer mensuel:</strong> ${property.rent.toFixed(2)} €</p>` : ''}
                    </div>

                    <h2>Résumé Financier</h2>
                    <div class="stats">
                        <div class="stat-box">
                            <h3>Revenus Totaux</h3>
                            <div class="amount revenue">${revenues.toFixed(2)} €</div>
                        </div>
                        <div class="stat-box">
                            <h3>Dépenses Totales</h3>
                            <div class="amount expense">${expenses.toFixed(2)} €</div>
                        </div>
                        <div class="stat-box">
                            <h3>Solde</h3>
                            <div class="amount" style="color: ${balance >= 0 ? '#2563eb' : '#f59e0b'}">${balance.toFixed(2)} €</div>
                        </div>
                    </div>

                    <h2>Transactions</h2>
                    ${property.transactions.length > 0 ? `
                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Type</th>
                                    <th>Catégorie</th>
                                    <th>Description</th>
                                    <th>Montant</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${property.transactions
                                    .sort((a, b) => new Date(b.date) - new Date(a.date))
                                    .map(t => `
                                        <tr>
                                            <td>${new Date(t.date).toLocaleDateString('fr-FR')}</td>
                                            <td>${t.type === 'revenue' ? 'Revenu' : 'Dépense'}</td>
                                            <td>${t.category}</td>
                                            <td>${t.description || '-'}</td>
                                            <td class="${t.type === 'revenue' ? 'revenue' : 'expense'}">
                                                ${t.type === 'revenue' ? '+' : '-'}${t.amount.toFixed(2)} €
                                            </td>
                                        </tr>
                                    `).join('')}
                            </tbody>
                        </table>
                    ` : '<p>Aucune transaction enregistrée</p>'}

                    <div class="footer">
                        <p><strong>PropertyHub</strong> - Gestion de Propriétés Immobilières</p>
                    </div>
                </body>
                </html>
            `);
            reportWindow.document.close();

            setTimeout(() => {
                reportWindow.print();
            }, 500);
        }
    </script>
</body>
</html>
