<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Propriétés Immobilières</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            min-height: 600px;
        }

        .sidebar {
            background: #f8f9fa;
            padding: 20px;
            border-right: 2px solid #e9ecef;
        }

        .btn {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
            padding: 8px 15px;
            font-size: 0.9em;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-warning {
            background: #ffc107;
            color: #212529;
        }

        .btn-warning:hover {
            background: #e0a800;
        }

        .property-list {
            margin-top: 20px;
        }

        .property-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .property-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .property-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .property-item h3 {
            margin-bottom: 5px;
        }

        .property-item p {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .content-area {
            padding: 30px;
            overflow-y: auto;
        }

        .welcome-screen {
            text-align: center;
            padding: 100px 20px;
            color: #6c757d;
        }

        .welcome-screen h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
        }

        .modal-header h2 {
            color: #667eea;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2em;
            cursor: pointer;
            color: #6c757d;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #f8f9fa;
            color: #dc3545;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .category-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #dee2e6;
        }

        .category-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-info {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .category-info p {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-info strong {
            color: #495057;
        }

        .password-toggle {
            cursor: pointer;
            color: #667eea;
            font-size: 0.9em;
            text-decoration: underline;
        }

        .finances-section {
            margin-top: 30px;
        }

        .finances-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-card h4 {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-card .amount {
            font-size: 2em;
            font-weight: bold;
        }

        .transactions-table {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #e9ecef;
        }

        .transactions-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .transactions-table th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #495057;
            border-bottom: 2px solid #e9ecef;
        }

        .transactions-table td {
            padding: 15px;
            border-bottom: 1px solid #f8f9fa;
        }

        .transactions-table tr:hover {
            background: #f8f9fa;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-revenue {
            background: #d4edda;
            color: #155724;
        }

        .badge-expense {
            background: #f8d7da;
            color: #721c24;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .icon {
            width: 24px;
            height: 24px;
            display: inline-block;
        }

        .export-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .export-section h3 {
            margin-bottom: 15px;
            color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .empty-state p {
            margin-top: 10px;
            font-size: 1.1em;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .sidebar {
                border-right: none;
                border-bottom: 2px solid #e9ecef;
            }

            .categories-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏠 Gestion de Propriétés</h1>
            <p>Gérez vos appartements et maisons en toute simplicité</p>
        </header>

        <div class="main-content">
            <div class="sidebar">
                <button class="btn btn-primary" onclick="showAddPropertyModal()">
                    ➕ Ajouter une Propriété
                </button>
                <button class="btn btn-secondary" onclick="exportData()">
                    💾 Sauvegarder les Données
                </button>
                <button class="btn btn-warning" onclick="importData()">
                    📂 Importer les Données
                </button>

                <div class="property-list" id="propertyList">
                    <!-- Liste des propriétés sera générée ici -->
                </div>
            </div>

            <div class="content-area" id="contentArea">
                <div class="welcome-screen">
                    <h2>👋 Bienvenue !</h2>
                    <p>Commencez par ajouter une propriété pour gérer vos logements</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Ajout Propriété -->
    <div id="addPropertyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Ajouter une Propriété</h2>
                <button class="close-btn" onclick="closeModal('addPropertyModal')">&times;</button>
            </div>
            <form id="addPropertyForm" onsubmit="addProperty(event)">
                <div class="form-group">
                    <label>Nom de la Propriété *</label>
                    <input type="text" id="propertyName" required placeholder="Ex: Appartement Paris 15ème">
                </div>
                <div class="form-group">
                    <label>Type *</label>
                    <select id="propertyType" required>
                        <option value="appartement">Appartement</option>
                        <option value="maison">Maison</option>
                        <option value="studio">Studio</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Adresse</label>
                    <textarea id="propertyAddress" rows="3" placeholder="Adresse complète"></textarea>
                </div>
                <div class="form-group">
                    <label>Statut</label>
                    <select id="propertyStatus">
                        <option value="loué">Loué</option>
                        <option value="disponible">Disponible</option>
                        <option value="propriétaire">Propriétaire (non loué)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Loyer Mensuel (€)</label>
                    <input type="number" id="propertyRent" placeholder="0" step="0.01">
                </div>
                <div class="action-buttons">
                    <button type="submit" class="btn btn-primary">Ajouter</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal('addPropertyModal')">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Édition Catégorie -->
    <div id="editCategoryModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="editCategoryTitle">Modifier la Catégorie</h2>
                <button class="close-btn" onclick="closeModal('editCategoryModal')">&times;</button>
            </div>
            <form id="editCategoryForm" onsubmit="saveCategory(event)">
                <div class="form-group">
                    <label>Fournisseur</label>
                    <input type="text" id="categoryProvider" placeholder="Ex: EDF, Engie, Veolia...">
                </div>
                <div class="form-group">
                    <label>Numéro de Compte / Référence</label>
                    <input type="text" id="categoryAccount" placeholder="Numéro de compte">
                </div>
                <div class="form-group">
                    <label>Identifiant</label>
                    <input type="text" id="categoryUsername" placeholder="Identifiant de connexion">
                </div>
                <div class="form-group">
                    <label>Mot de Passe</label>
                    <input type="password" id="categoryPassword" placeholder="Mot de passe">
                </div>
                <div class="form-group">
                    <label>URL du Dashboard</label>
                    <input type="url" id="categoryUrl" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="categoryNotes" rows="3" placeholder="Notes additionnelles..."></textarea>
                </div>
                <div class="action-buttons">
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal('editCategoryModal')">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Ajout Transaction -->
    <div id="addTransactionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Ajouter une Transaction</h2>
                <button class="close-btn" onclick="closeModal('addTransactionModal')">&times;</button>
            </div>
            <form id="addTransactionForm" onsubmit="addTransaction(event)">
                <div class="form-group">
                    <label>Type *</label>
                    <select id="transactionType" required>
                        <option value="revenue">Revenu (Loyer)</option>
                        <option value="expense">Dépense (Facture)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Catégorie *</label>
                    <select id="transactionCategory" required>
                        <option value="loyer">Loyer</option>
                        <option value="électricité">Électricité</option>
                        <option value="gaz">Gaz</option>
                        <option value="eau">Eau</option>
                        <option value="taxe">Taxe</option>
                        <option value="impôt">Impôt</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Montant (€) *</label>
                    <input type="number" id="transactionAmount" required step="0.01" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Date *</label>
                    <input type="date" id="transactionDate" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="transactionDescription" placeholder="Description de la transaction">
                </div>
                <div class="action-buttons">
                    <button type="submit" class="btn btn-primary">Ajouter</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal('addTransactionModal')">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Stockage des données
        let properties = [];
        let currentPropertyId = null;

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            renderPropertyList();
            // Définir la date par défaut à aujourd'hui
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('transactionDate').value = today;
        });

        // Gestion du stockage local
        function saveToLocalStorage() {
            localStorage.setItem('propertyManagementData', JSON.stringify(properties));
        }

        function loadData() {
            const savedData = localStorage.getItem('propertyManagementData');
            if (savedData) {
                properties = JSON.parse(savedData);
            }
        }

        // Gestion des modals
        function showModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function showAddPropertyModal() {
            document.getElementById('addPropertyForm').reset();
            showModal('addPropertyModal');
        }

        // Ajout de propriété
        function addProperty(event) {
            event.preventDefault();

            const property = {
                id: Date.now(),
                name: document.getElementById('propertyName').value,
                type: document.getElementById('propertyType').value,
                address: document.getElementById('propertyAddress').value,
                status: document.getElementById('propertyStatus').value,
                rent: parseFloat(document.getElementById('propertyRent').value) || 0,
                categories: {
                    électricité: {},
                    gaz: {},
                    eau: {},
                    taxe: {},
                    impôt: {}
                },
                transactions: []
            };

            properties.push(property);
            saveToLocalStorage();
            renderPropertyList();
            closeModal('addPropertyModal');
            showProperty(property.id);
        }

        // Affichage de la liste des propriétés
        function renderPropertyList() {
            const listElement = document.getElementById('propertyList');

            if (properties.length === 0) {
                listElement.innerHTML = '<p style="text-align: center; color: #6c757d; margin-top: 20px;">Aucune propriété</p>';
                return;
            }

            listElement.innerHTML = properties.map(property => `
                <div class="property-item ${currentPropertyId === property.id ? 'active' : ''}"
                     onclick="showProperty(${property.id})">
                    <h3>${property.name}</h3>
                    <p>${property.type.charAt(0).toUpperCase() + property.type.slice(1)} - ${property.status}</p>
                </div>
            `).join('');
        }

        // Affichage d'une propriété
        function showProperty(propertyId) {
            currentPropertyId = propertyId;
            const property = properties.find(p => p.id === propertyId);

            if (!property) return;

            renderPropertyList();

            const contentArea = document.getElementById('contentArea');

            // Calcul des statistiques
            const revenues = property.transactions
                .filter(t => t.type === 'revenue')
                .reduce((sum, t) => sum + t.amount, 0);

            const expenses = property.transactions
                .filter(t => t.type === 'expense')
                .reduce((sum, t) => sum + t.amount, 0);

            const balance = revenues - expenses;

            contentArea.innerHTML = `
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                        <div>
                            <h2 style="color: #667eea; margin-bottom: 10px;">${property.name}</h2>
                            <p style="color: #6c757d;">${property.type.charAt(0).toUpperCase() + property.type.slice(1)} - ${property.status}</p>
                            ${property.address ? `<p style="color: #6c757d; margin-top: 5px;">📍 ${property.address}</p>` : ''}
                            ${property.rent > 0 ? `<p style="color: #28a745; margin-top: 5px; font-weight: 600;">💰 ${property.rent.toFixed(2)} € / mois</p>` : ''}
                        </div>
                        <button class="btn btn-danger" onclick="deleteProperty(${property.id})">
                            🗑️ Supprimer
                        </button>
                    </div>

                    <h3 style="color: #667eea; margin-bottom: 20px;">📋 Informations des Comptes</h3>
                    <div class="categories-grid">
                        ${renderCategories(property)}
                    </div>

                    <div class="finances-section">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h3 style="color: #667eea;">💰 Gestion Financière</h3>
                            <button class="btn btn-success" onclick="showAddTransactionModal()">
                                ➕ Ajouter une Transaction
                            </button>
                        </div>

                        <div class="finances-grid">
                            <div class="stat-card" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%);">
                                <h4>REVENUS TOTAUX</h4>
                                <div class="amount">${revenues.toFixed(2)} €</div>
                            </div>
                            <div class="stat-card" style="background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);">
                                <h4>DÉPENSES TOTALES</h4>
                                <div class="amount">${expenses.toFixed(2)} €</div>
                            </div>
                            <div class="stat-card" style="background: linear-gradient(135deg, ${balance >= 0 ? '#17a2b8' : '#fd7e14'} 0%, ${balance >= 0 ? '#138496' : '#e8590c'} 100%);">
                                <h4>SOLDE</h4>
                                <div class="amount">${balance.toFixed(2)} €</div>
                            </div>
                        </div>

                        ${renderTransactions(property)}

                        <div class="export-section">
                            <h3>📊 Exporter les Données</h3>
                            <div class="action-buttons">
                                <button class="btn btn-primary" onclick="exportPropertyToCSV(${property.id})">
                                    📄 Exporter en CSV
                                </button>
                                <button class="btn btn-primary" onclick="exportPropertyToPDF(${property.id})">
                                    📑 Générer Rapport PDF
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Affichage des catégories
        function renderCategories(property) {
            const categoryIcons = {
                'électricité': '⚡',
                'gaz': '🔥',
                'eau': '💧',
                'taxe': '🏛️',
                'impôt': '📊'
            };

            return Object.keys(property.categories).map(categoryName => {
                const category = property.categories[categoryName];
                const hasData = category.provider || category.username || category.password;

                return `
                    <div class="category-card">
                        <h3>${categoryIcons[categoryName]} ${categoryName.charAt(0).toUpperCase() + categoryName.slice(1)}</h3>
                        ${hasData ? `
                            <div class="category-info">
                                ${category.provider ? `<p><strong>Fournisseur:</strong> <span>${category.provider}</span></p>` : ''}
                                ${category.account ? `<p><strong>N° Compte:</strong> <span>${category.account}</span></p>` : ''}
                                ${category.username ? `<p><strong>Identifiant:</strong> <span>${category.username}</span></p>` : ''}
                                ${category.password ? `
                                    <p>
                                        <strong>Mot de passe:</strong>
                                        <span>
                                            <span class="password-field" id="pwd-${property.id}-${categoryName}">••••••••</span>
                                            <span class="password-toggle" onclick="togglePassword(${property.id}, '${categoryName}')">Afficher</span>
                                        </span>
                                    </p>
                                ` : ''}
                                ${category.url ? `<p><strong>Dashboard:</strong> <a href="${category.url}" target="_blank" style="color: #667eea;">${category.url}</a></p>` : ''}
                                ${category.notes ? `<p><strong>Notes:</strong> <span>${category.notes}</span></p>` : ''}
                            </div>
                        ` : '<p style="color: #6c757d; text-align: center;">Aucune information</p>'}
                        <button class="btn btn-primary" style="margin-top: 10px;" onclick="editCategory(${property.id}, '${categoryName}')">
                            ✏️ Modifier
                        </button>
                    </div>
                `;
            }).join('');
        }

        // Toggle mot de passe
        function togglePassword(propertyId, categoryName) {
            const property = properties.find(p => p.id === propertyId);
            const pwdElement = document.getElementById(`pwd-${propertyId}-${categoryName}`);
            const toggleBtn = pwdElement.nextElementSibling;

            if (pwdElement.textContent === '••••••••') {
                pwdElement.textContent = property.categories[categoryName].password;
                toggleBtn.textContent = 'Masquer';
            } else {
                pwdElement.textContent = '••••••••';
                toggleBtn.textContent = 'Afficher';
            }
        }

        // Édition de catégorie
        let currentEditCategory = null;

        function editCategory(propertyId, categoryName) {
            currentEditCategory = { propertyId, categoryName };
            const property = properties.find(p => p.id === propertyId);
            const category = property.categories[categoryName];

            document.getElementById('editCategoryTitle').textContent =
                `Modifier ${categoryName.charAt(0).toUpperCase() + categoryName.slice(1)}`;

            document.getElementById('categoryProvider').value = category.provider || '';
            document.getElementById('categoryAccount').value = category.account || '';
            document.getElementById('categoryUsername').value = category.username || '';
            document.getElementById('categoryPassword').value = category.password || '';
            document.getElementById('categoryUrl').value = category.url || '';
            document.getElementById('categoryNotes').value = category.notes || '';

            showModal('editCategoryModal');
        }

        function saveCategory(event) {
            event.preventDefault();

            if (!currentEditCategory) return;

            const property = properties.find(p => p.id === currentEditCategory.propertyId);
            property.categories[currentEditCategory.categoryName] = {
                provider: document.getElementById('categoryProvider').value,
                account: document.getElementById('categoryAccount').value,
                username: document.getElementById('categoryUsername').value,
                password: document.getElementById('categoryPassword').value,
                url: document.getElementById('categoryUrl').value,
                notes: document.getElementById('categoryNotes').value
            };

            saveToLocalStorage();
            closeModal('editCategoryModal');
            showProperty(currentEditCategory.propertyId);
        }

        // Gestion des transactions
        function showAddTransactionModal() {
            document.getElementById('addTransactionForm').reset();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('transactionDate').value = today;
            showModal('addTransactionModal');
        }

        function addTransaction(event) {
            event.preventDefault();

            if (!currentPropertyId) return;

            const property = properties.find(p => p.id === currentPropertyId);

            const transaction = {
                id: Date.now(),
                type: document.getElementById('transactionType').value,
                category: document.getElementById('transactionCategory').value,
                amount: parseFloat(document.getElementById('transactionAmount').value),
                date: document.getElementById('transactionDate').value,
                description: document.getElementById('transactionDescription').value
            };

            property.transactions.push(transaction);
            saveToLocalStorage();
            closeModal('addTransactionModal');
            showProperty(currentPropertyId);
        }

        function renderTransactions(property) {
            if (property.transactions.length === 0) {
                return `
                    <div class="empty-state">
                        <p>📝 Aucune transaction enregistrée</p>
                    </div>
                `;
            }

            // Trier par date décroissante
            const sortedTransactions = [...property.transactions].sort((a, b) =>
                new Date(b.date) - new Date(a.date)
            );

            return `
                <div class="transactions-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Type</th>
                                <th>Catégorie</th>
                                <th>Description</th>
                                <th>Montant</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${sortedTransactions.map(transaction => `
                                <tr>
                                    <td>${new Date(transaction.date).toLocaleDateString('fr-FR')}</td>
                                    <td>
                                        <span class="badge ${transaction.type === 'revenue' ? 'badge-revenue' : 'badge-expense'}">
                                            ${transaction.type === 'revenue' ? '💰 Revenu' : '💸 Dépense'}
                                        </span>
                                    </td>
                                    <td>${transaction.category}</td>
                                    <td>${transaction.description || '-'}</td>
                                    <td style="font-weight: 600; color: ${transaction.type === 'revenue' ? '#28a745' : '#dc3545'}">
                                        ${transaction.type === 'revenue' ? '+' : '-'}${transaction.amount.toFixed(2)} €
                                    </td>
                                    <td>
                                        <button class="btn btn-danger" style="padding: 5px 10px; font-size: 0.85em;"
                                                onclick="deleteTransaction(${property.id}, ${transaction.id})">
                                            🗑️
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function deleteTransaction(propertyId, transactionId) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer cette transaction ?')) return;

            const property = properties.find(p => p.id === propertyId);
            property.transactions = property.transactions.filter(t => t.id !== transactionId);

            saveToLocalStorage();
            showProperty(propertyId);
        }

        // Suppression de propriété
        function deleteProperty(propertyId) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer cette propriété ? Toutes les données seront perdues.')) return;

            properties = properties.filter(p => p.id !== propertyId);
            saveToLocalStorage();
            renderPropertyList();

            document.getElementById('contentArea').innerHTML = `
                <div class="welcome-screen">
                    <h2>👋 Bienvenue !</h2>
                    <p>Sélectionnez une propriété ou ajoutez-en une nouvelle</p>
                </div>
            `;

            currentPropertyId = null;
        }

        // Export / Import
        function exportData() {
            const dataStr = JSON.stringify(properties, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `gestion-proprietes-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            input.onchange = function(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        if (confirm('Voulez-vous remplacer toutes les données actuelles par les données importées ?')) {
                            properties = importedData;
                            saveToLocalStorage();
                            renderPropertyList();
                            alert('Données importées avec succès !');
                        }
                    } catch (error) {
                        alert('Erreur lors de l\'importation des données. Vérifiez que le fichier est valide.');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function exportPropertyToCSV(propertyId) {
            const property = properties.find(p => p.id === propertyId);
            if (!property) return;

            let csv = 'Date,Type,Catégorie,Description,Montant\n';

            property.transactions.forEach(transaction => {
                const row = [
                    transaction.date,
                    transaction.type === 'revenue' ? 'Revenu' : 'Dépense',
                    transaction.category,
                    transaction.description || '',
                    transaction.amount.toFixed(2)
                ].map(field => `"${field}"`).join(',');
                csv += row + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${property.name.replace(/\s+/g, '-')}-transactions.csv`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function exportPropertyToPDF(propertyId) {
            const property = properties.find(p => p.id === propertyId);
            if (!property) return;

            // Calcul des statistiques
            const revenues = property.transactions
                .filter(t => t.type === 'revenue')
                .reduce((sum, t) => sum + t.amount, 0);

            const expenses = property.transactions
                .filter(t => t.type === 'expense')
                .reduce((sum, t) => sum + t.amount, 0);

            const balance = revenues - expenses;

            // Générer un document HTML pour impression
            const reportWindow = window.open('', '_blank');
            reportWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>Rapport - ${property.name}</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 40px; }
                        h1 { color: #667eea; }
                        h2 { color: #495057; margin-top: 30px; }
                        .info { margin: 20px 0; }
                        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 30px 0; }
                        .stat-box { background: #f8f9fa; padding: 20px; border-radius: 10px; text-align: center; }
                        .stat-box h3 { margin: 0; font-size: 0.9em; color: #6c757d; }
                        .stat-box .amount { font-size: 2em; font-weight: bold; margin-top: 10px; }
                        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                        th, td { border: 1px solid #dee2e6; padding: 12px; text-align: left; }
                        th { background: #f8f9fa; font-weight: 600; }
                        .revenue { color: #28a745; }
                        .expense { color: #dc3545; }
                        .footer { margin-top: 40px; padding-top: 20px; border-top: 2px solid #dee2e6; color: #6c757d; text-align: center; }
                    </style>
                </head>
                <body>
                    <h1>📊 Rapport de Propriété</h1>
                    <div class="info">
                        <h2>${property.name}</h2>
                        <p><strong>Type:</strong> ${property.type}</p>
                        <p><strong>Statut:</strong> ${property.status}</p>
                        ${property.address ? `<p><strong>Adresse:</strong> ${property.address}</p>` : ''}
                        ${property.rent > 0 ? `<p><strong>Loyer:</strong> ${property.rent.toFixed(2)} € / mois</p>` : ''}
                    </div>

                    <h2>Résumé Financier</h2>
                    <div class="stats">
                        <div class="stat-box">
                            <h3>Revenus Totaux</h3>
                            <div class="amount revenue">${revenues.toFixed(2)} €</div>
                        </div>
                        <div class="stat-box">
                            <h3>Dépenses Totales</h3>
                            <div class="amount expense">${expenses.toFixed(2)} €</div>
                        </div>
                        <div class="stat-box">
                            <h3>Solde</h3>
                            <div class="amount" style="color: ${balance >= 0 ? '#17a2b8' : '#fd7e14'}">${balance.toFixed(2)} €</div>
                        </div>
                    </div>

                    <h2>Transactions</h2>
                    ${property.transactions.length > 0 ? `
                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Type</th>
                                    <th>Catégorie</th>
                                    <th>Description</th>
                                    <th>Montant</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${property.transactions
                                    .sort((a, b) => new Date(b.date) - new Date(a.date))
                                    .map(t => `
                                        <tr>
                                            <td>${new Date(t.date).toLocaleDateString('fr-FR')}</td>
                                            <td>${t.type === 'revenue' ? 'Revenu' : 'Dépense'}</td>
                                            <td>${t.category}</td>
                                            <td>${t.description || '-'}</td>
                                            <td class="${t.type === 'revenue' ? 'revenue' : 'expense'}">
                                                ${t.type === 'revenue' ? '+' : '-'}${t.amount.toFixed(2)} €
                                            </td>
                                        </tr>
                                    `).join('')}
                            </tbody>
                        </table>
                    ` : '<p>Aucune transaction enregistrée</p>'}

                    <div class="footer">
                        <p>Rapport généré le ${new Date().toLocaleDateString('fr-FR')} à ${new Date().toLocaleTimeString('fr-FR')}</p>
                        <p>Gestion de Propriétés Immobilières</p>
                    </div>
                </body>
                </html>
            `);
            reportWindow.document.close();

            setTimeout(() => {
                reportWindow.print();
            }, 500);
        }
    </script>
</body>
</html>
